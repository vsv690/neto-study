#cloud-config
package_update: true
package_upgrade: true
ssh_pwauth: no

users:
  - name: ${username}
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_authorized_keys:
      - "${ssh_key}"

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq

runcmd:
  - |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - |
    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu focal stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ${username}
  - |
    export IAM_TOKEN=$(curl -s -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | jq -r .access_token)
    echo $IAM_TOKEN | docker login --username iam --password-stdin cr.yandex
  - docker pull cr.yandex/${registry_id}/${image_name}:latest
  - |
    docker run -d --name webapp -p 80:8080 \
      -e DB_HOST="${db_host}" \
      -e DB_USER="${db_user}" \
      -e DB_PASSWORD="${db_password}" \
      -e DB_NAME="${db_name}" \
      cr.yandex/${registry_id}/${image_name}:latest